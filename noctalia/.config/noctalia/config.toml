# Noctalia (v5) — оболочка для Hyprland: панель, лаунчер, центр управления,
# уведомления, обои, экран блокировки. Здесь только отличия от дефолтов,
# всё остальное удобнее менять в GUI (Super + ,) — оно сохраняется
# в ~/.local/state/noctalia/settings.toml и перекрывает этот файл.
# Все опции: https://github.com/noctalia-dev/noctalia/blob/main/example.toml

[theme]
mode    = "dark"
source  = "builtin"
builtin = "Catppuccin"

[wallpaper]
# Коллекции Catppuccin Mocha (git clone в ~/Pictures/Wallpapers, обновить: git -C <папка> pull)
directory = "~/Pictures/Wallpapers"

# Автосмена обоев — выключена; включить: enabled = true (или в настройках, Super + ,)
[wallpaper.automation]
enabled          = false
interval_seconds = 1800
order            = "random"
recursive        = true

[wallpaper.default]
path = "~/dotfiles/wallpapers/catppuccin-mocha.png"

# Затемнение/блокировку/сон делает hypridle (общий с запасным режимом без Noctalia),
# поэтому встроенный idle Noctalia выключен — это и так дефолт, оставлено для ясности.
[idle.behavior.lock]
enabled = false

[idle.behavior.screen-off]
enabled = false
