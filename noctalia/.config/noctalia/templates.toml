# Шаблоны Noctalia: перекрашивают программы под текущую палитру (тему или обои).
# KColorScheme не включён — он перекрасил бы саму Plasma.
# Firefox — отдельный локальный шаблон в ~/.config/noctalia/local-firefox.toml (не в dotfiles).
[theme.templates]
enable_builtin_templates = true
builtin_ids = ["kitty", "btop", "cava", "gtk3", "gtk4", "qt"]

# Цветовая схема KDE без применения к Plasma (встроенный kcolorscheme применяет её глобально).
# Подхватывается KDE-программами только в Hyprland через hypr/kde/kdeglobals.
[theme.templates.user.kde-colors]
input_path  = "/usr/share/noctalia/assets/templates/kde/kcolorscheme.colors"
output_path = "$XDG_DATA_HOME/color-schemes/noctalia.colors"
