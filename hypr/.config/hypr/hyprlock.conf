# Catppuccin Mocha
$font   = JetBrainsMono Nerd Font
$text   = rgb(cdd6f4)
$mauve  = rgb(cba6f7)
$blue   = rgb(89b4fa)
$red    = rgb(f38ba8)
$green  = rgb(a6e3a1)
$base   = rgba(1e1e2ecc)

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 6
    brightness = 0.6
}

# Время
label {
    monitor =
    text = $TIME
    color = $text
    font_size = 96
    font_family = $font
    position = 0, 160
    halign = center
    valign = center
}

# Дата
label {
    monitor =
    text = cmd[update:60000] LC_TIME=ru_RU.UTF-8 date +"%A, %d %B"
    color = $text
    font_size = 20
    font_family = $font
    position = 0, 60
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 56
    outline_thickness = 3
    inner_color = $base
    outer_color = $mauve $blue 45deg
    check_color = $green
    fail_color = $red
    font_color = $text
    font_family = $font
    fade_on_empty = false
    rounding = 14
    placeholder_text = <i>Пароль...</i>
    fail_text = $PAMFAIL
    dots_spacing = 0.3
    position = 0, -40
    halign = center
    valign = center
}

# Раскладка (клик — переключить)
label {
    monitor =
    text = $LAYOUT[EN,RU]
    color = $text
    font_size = 14
    font_family = $font
    onclick = hyprctl switchxkblayout all next
    position = 0, -100
    halign = center
    valign = center
}
