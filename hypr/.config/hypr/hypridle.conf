# Экран блокировки — ~/.local/bin/lockscreen (qylock / Noctalia / hyprlock), общий с driftwm.
# Не через loginctl lock-session: на этот сигнал Noctalia показывает свой экран,
# и два экрана блокировки конфликтовали бы.
general {
    lock_cmd = ~/.local/bin/lockscreen
    before_sleep_cmd = ~/.local/bin/lockscreen
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# 3 мин — приглушить экран
listener {
    timeout = 180
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

# 5 мин — заблокировать
listener {
    timeout = 300
    on-timeout = ~/.local/bin/lockscreen
}

# 5.5 мин — выключить экран
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# 30 мин — сон
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
